services:
  - type: web
    name: drug-checker-sms-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: bash render_start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DRUG_CHECKER_DB_PATH
        value: /tmp/drugs.db
      - key: DRUG_CHECKER_LOG_PATH
        value: /tmp/drug_db.log
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
